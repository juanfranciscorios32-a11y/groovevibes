<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Groovevibes — Sistema de Gestión</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .tab-active { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: white; }
    .gradient-bg { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%); }
    .card-hover { transition: all 0.2s ease; }
    .card-hover:hover { transform: translateY(-2px); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); }
    .scroll-shadow { box-shadow: inset 0 -10px 10px -10px rgba(0,0,0,0.1); }
    @keyframes pulse-red { 0%,100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.4); } 50% { box-shadow: 0 0 0 8px rgba(239,68,68,0); } }
    .pulse-urgent { animation: pulse-red 2s infinite; }
    .step-dot { transition: all 0.3s ease; }
    .step-dot.active { background: #6366f1; transform: scale(1.2); }
    .step-dot.done { background: #10b981; }
    details > summary { list-style: none; cursor: pointer; }
    details > summary::-webkit-details-marker { display: none; }
    .checklist-item { transition: all 0.2s ease; }
    .checklist-item.done { background: #f0fdf4; }
    .checklist-item.done .check-label { text-decoration: line-through; color: #6b7280; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen">

<!-- ================= NAVBAR ================= -->
<nav class="gradient-bg text-white shadow-lg sticky top-0 z-40">
  <div class="max-w-7xl mx-auto px-4 sm:px-6">
    <div class="flex justify-between items-center h-16">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-indigo-400 to-purple-500 flex items-center justify-center font-bold text-lg">GV</div>
        <div>
          <h1 class="font-bold text-lg leading-tight">Groovevibes</h1>
          <p class="text-xs text-indigo-200">Sistema de Gestión</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="openNewDate()" class="hidden sm:inline-flex items-center gap-2 bg-white text-indigo-700 hover:bg-indigo-50 font-semibold px-4 py-2 rounded-lg text-sm shadow">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
          Agendar fecha
        </button>
        <div class="hidden sm:flex items-center gap-2 bg-white/10 rounded-full px-3 py-1.5">
          <div class="w-7 h-7 rounded-full bg-gradient-to-br from-pink-400 to-orange-400 flex items-center justify-center text-xs font-bold">JF</div>
          <span class="text-sm">Juanfra</span>
        </div>
      </div>
    </div>
    <div class="flex gap-1 overflow-x-auto pb-1 -mx-1 px-1">
      <button onclick="navigate('dashboard')" data-tab="dashboard" class="tab-btn whitespace-nowrap px-4 py-2 rounded-t-lg text-sm font-medium hover:bg-white/10">Dashboard</button>
      <button onclick="navigate('calendario')" data-tab="calendario" class="tab-btn whitespace-nowrap px-4 py-2 rounded-t-lg text-sm font-medium hover:bg-white/10">Calendario</button>
      <button onclick="navigate('seguimiento')" data-tab="seguimiento" class="tab-btn whitespace-nowrap px-4 py-2 rounded-t-lg text-sm font-medium hover:bg-white/10">Seguimiento</button>
      <button onclick="navigate('roster')" data-tab="roster" class="tab-btn whitespace-nowrap px-4 py-2 rounded-t-lg text-sm font-medium hover:bg-white/10">Roster</button>
      <button onclick="navigate('venues')" data-tab="venues" class="tab-btn whitespace-nowrap px-4 py-2 rounded-t-lg text-sm font-medium hover:bg-white/10">Venues</button>
    </div>
  </div>
</nav>

<!-- Floating add button (mobile) -->
<button onclick="openNewDate()" class="sm:hidden fixed bottom-6 right-6 z-30 w-14 h-14 rounded-full bg-gradient-to-br from-indigo-500 to-purple-600 text-white shadow-2xl flex items-center justify-center">
  <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/></svg>
</button>

<!-- ================= MAIN ================= -->
<main id="app" class="max-w-7xl mx-auto px-4 sm:px-6 py-6"></main>

<!-- ================= NEW DATE WIZARD MODAL ================= -->
<div id="wizardModal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm overflow-y-auto">
  <div class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl w-full max-w-2xl shadow-2xl">
      <div class="gradient-bg text-white px-6 py-5 rounded-t-2xl flex justify-between items-center">
        <div>
          <h2 class="font-bold text-lg">Agendar nueva fecha</h2>
          <p class="text-xs text-indigo-200">Paso <span id="stepNum">1</span> de 6</p>
        </div>
        <button onclick="closeWizard()" class="text-white/70 hover:text-white text-2xl leading-none">&times;</button>
      </div>
      <div class="px-6 pt-4">
        <div class="flex gap-2 mb-4" id="stepDots"></div>
      </div>
      <div id="wizardBody" class="px-6 pb-6"></div>
      <div class="border-t border-slate-200 px-6 py-4 flex justify-between bg-slate-50 rounded-b-2xl">
        <button id="prevBtn" onclick="prevStep()" class="px-4 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-200">← Anterior</button>
        <button id="nextBtn" onclick="nextStep()" class="px-6 py-2 rounded-lg text-sm font-semibold bg-indigo-600 hover:bg-indigo-700 text-white shadow">Siguiente →</button>
      </div>
    </div>
  </div>
</div>

<!-- ================= EVENT DETAIL MODAL ================= -->
<div id="eventModal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm overflow-y-auto">

<!-- ================= ANNUAL PLANNER MODAL ================= -->
<div id="plannerModal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm overflow-y-auto">

/* Estado mutable: se persiste en localStorage */
const STORAGE_KEY = "groovevibes_state_v1";
let state = loadState();

function loadState() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (saved && saved.calendario) {
      // Migración: agregar IDs a pipeline si faltan, sembrar updates desde obs si está vacío
      saved.pipeline = (saved.pipeline || []).map((p, i) => ({ ...p, id: p.id || ("p" + String(i+1).padStart(3,"0")) }));
      if (!saved.updates || saved.updates.length === 0) {
        saved.updates = [];
        saved.pipeline.forEach((p, idx) => {
          if (p.obs) {
            const ts = p.ultimoFollow && /^\d{4}-\d{2}-\d{2}$/.test(p.ultimoFollow)
              ? new Date(p.ultimoFollow + "T12:00:00").toISOString()
              : new Date(Date.now() - (60 + idx) * 86400000).toISOString();
            saved.updates.push({
              id: "u_init_" + idx,
              oppId: p.id,
              timestamp: ts,
              encargado: p.encargado || "—",
              comentario: p.obs,
              contacto: p.contacto || ""
            });
          }
        });
      }
      saved.currentUser = saved.currentUser || "Juanfra";
      saved.planner = saved.planner || [];
      return saved;
    }
  } catch(e){}
  // estado inicial: copia de SEED + checklists + IDs en pipeline + updates iniciales desde obs
  const pipeline = SEED.pipeline.map((p, i) => ({ ...p, id: "p" + String(i+1).padStart(3,"0") }));
  const updates = [];
  pipeline.forEach((p, idx) => {
    if (p.obs) {
      const ts = p.ultimoFollow && /^\d{4}-\d{2}-\d{2}$/.test(p.ultimoFollow)
        ? new Date(p.ultimoFollow + "T12:00:00").toISOString()
        : new Date(Date.now() - (60 + idx) * 86400000).toISOString();
      updates.push({
        id: "u_init_" + idx,
        oppId: p.id,
        timestamp: ts,
        encargado: p.encargado || "—",
        comentario: p.obs,
        contacto: p.contacto || ""
      });
    }
  });
  return {
    calendario: SEED.calendario.map(e => ({ ...e, checklistPre: {}, checklistPost: {}, gastos: 0 })),
    pipeline,
    updates,
    planner: [],
    currentUser: "Juanfra"
  };
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

/* Datos derivados */
function todayISO() { return new Date().toISOString().slice(0,10); }
function daysUntil(iso) {
  const d = new Date(iso + "T00:00:00");
  const today = new Date(todayISO() + "T00:00:00");
  return Math.round((d - today) / 86400000);
}
function fmtDate(iso) {
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString("es-AR", { weekday:"short", day:"numeric", month:"short", year:"numeric" });
}
function fmtDateShort(iso) {
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString("es-AR", { day:"2-digit", month:"2-digit", year:"2-digit" });
}

let currentTab = "dashboard";
function navigate(tab) {
  currentTab = tab;
  document.querySelectorAll(".tab-btn").forEach(b => {
    b.classList.toggle("tab-active", b.dataset.tab === tab);
  });
  render();
}

function render() {
  const app = document.getElementById("app");
  if (currentTab === "dashboard") app.innerHTML = renderDashboard();
  else if (currentTab === "calendario") app.innerHTML = renderCalendario();
  else if (currentTab === "seguimiento") app.innerHTML = renderSeguimiento();
  else if (currentTab === "roster") app.innerHTML = renderRoster();
  else if (currentTab === "venues") app.innerHTML = renderVenues();
}

============================================================ */
function getUrgentEvents() {
  return state.calendario.filter(e => {
    if (e.estado === "Finalizado") return false;
    const d = daysUntil(e.fecha);
    if (d < 0 || d > 7) return false;
    return !isPreComplete(e);
  }).sort((a,b)=>a.fecha.localeCompare(b.fecha));
}
function getUpcoming(limit=8) {
  const today = todayISO();
  return state.calendario.filter(e => e.fecha >= today && e.estado !== "Finalizado")
    .sort((a,b)=>a.fecha.localeCompare(b.fecha)).slice(0, limit);
}
function getPostPending() {
  return state.calendario.filter(e => {
    const d = daysUntil(e.fecha);
    return d < 0 && d >= -30 && !isPostComplete(e);
  }).sort((a,b)=>b.fecha.localeCompare(a.fecha));
}
function isPreComplete(e) {
  const required = PRE_CHECKLIST.filter(i => !i.optional);
  return required.every(i => {
    const v = (e.checklistPre || {})[i.key];
    if (i.type === "check") return v === true;
    return v && String(v).trim().length > 0;
  });
}
function isPostComplete(e) {
  return POST_CHECKLIST.every(i => {
    const v = (e.checklistPost || {})[i.key];
    if (i.type === "check") return v === true;
    return v && String(v).trim().length > 0;
  });
}

function renderDashboard() {
  const urgent = getUrgentEvents();
  const upcoming = getUpcoming();
  const postPending = getPostPending();
  const totalConfirmados = state.calendario.filter(e=>e.estado==="Confirmado").length;
  const totalFinalizados = state.calendario.filter(e=>e.estado==="Finalizado").length;
  const totalPorConfirmar = state.calendario.filter(e=>e.estado==="Por confirmar").length;
  const pipelineActivo = state.pipeline.length;

  return `
  <section class="space-y-6">
    <!-- Hero -->
    <div class="gradient-bg text-white rounded-2xl p-6 sm:p-8 shadow-lg">
      <p class="text-indigo-200 text-sm">${new Date().toLocaleDateString("es-AR",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}</p>
      <h2 class="text-2xl sm:text-3xl font-bold mt-1">Hola Juanfra </h2>
      <p class="text-indigo-100 mt-2">Tenés <span class="font-bold text-white">${urgent.length}</span> fecha${urgent.length!==1?'s':''} urgente${urgent.length!==1?'s':''} y <span class="font-bold text-white">${upcoming.length}</span> próximas en agenda.</p>
    </div>

    <!-- Stats -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 sm:gap-4">
      ${statCard("Confirmadas", totalConfirmados, "indigo", "")}
      ${statCard("Finalizadas", totalFinalizados, "emerald", "")}
      ${statCard("Por confirmar", totalPorConfirmar, "amber", "")}
      ${statCard("Pipeline", pipelineActivo, "purple", "")}
    </div>

    <!-- Urgentes -->
    ${urgent.length > 0 ? `
    <div class="bg-white rounded-2xl shadow-sm border border-rose-200 overflow-hidden">
      <div class="bg-gradient-to-r from-rose-500 to-orange-500 text-white px-5 py-3 flex items-center gap-2">
        <span class="text-xl"></span>
        <h3 class="font-bold">Atención: fechas a menos de 7 días con checklist incompleto</h3>
      </div>
      <div class="divide-y divide-slate-100">
        ${urgent.map(e => urgentRow(e)).join("")}
      </div>
    </div>` : `
    <div class="bg-emerald-50 border border-emerald-200 rounded-2xl p-5 flex items-center gap-3">
      <span class="text-2xl"></span>
      <div>
        <p class="font-semibold text-emerald-900">Todo bajo control</p>
        <p class="text-sm text-emerald-700">No hay fechas urgentes con checklist incompleto.</p>
      </div>
    </div>
    `}

    <!-- Próximas -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between">
        <h3 class="font-bold text-slate-800">Próximas fechas</h3>
        <button onclick="navigate('calendario')" class="text-sm text-indigo-600 hover:underline">Ver todas →</button>
      </div>
      <div class="divide-y divide-slate-100">
        ${upcoming.length ? upcoming.map(e => upcomingRow(e)).join("") : '<p class="px-5 py-8 text-center text-slate-400">Sin fechas próximas agendadas.</p>'}
      </div>
    </div>

    <!-- Post-evento pendientes -->
    ${postPending.length > 0 ? `
    <div class="bg-white rounded-2xl shadow-sm border border-amber-200 overflow-hidden">
      <div class="bg-amber-50 px-5 py-3 flex items-center gap-2 border-b border-amber-200">
        <span class="text-xl"></span>
        <h3 class="font-bold text-amber-900">Cierre post-evento pendiente</h3>
      </div>
      <div class="divide-y divide-slate-100">
        ${postPending.slice(0,5).map(e => postPendingRow(e)).join("")}
      </div>
    </div>` : ""}
  </section>
  `;
}

function statCard(label, val, color, icon) {
  const colors = {
    indigo: "from-indigo-500 to-indigo-600",
    emerald: "from-emerald-500 to-emerald-600",
    amber: "from-amber-500 to-amber-600",
    purple: "from-purple-500 to-purple-600"
  };
  return `
    <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-200 card-hover">
      <div class="flex items-center justify-between mb-2">
        <span class="text-2xl">${icon}</span>
        <span class="text-xs font-medium text-slate-500">${label}</span>
      </div>
      <p class="text-3xl font-bold bg-gradient-to-br ${colors[color]} bg-clip-text text-transparent">${val}</p>
    </div>
  `;
}

function urgentRow(e) {
  const d = daysUntil(e.fecha);
  const dLabel = d === 0 ? "HOY" : d === 1 ? "MAÑANA" : d < 0 ? `Hace ${-d}d` : `En ${d} días`;
  return `
    <button onclick="openEvent('${e.id}')" class="w-full text-left px-5 py-4 hover:bg-rose-50 transition flex items-center gap-4">
      <div class="flex-shrink-0 w-14 text-center">
        <div class="text-xs font-bold text-rose-600">${dLabel}</div>
        <div class="text-xs text-slate-500 mt-0.5">${fmtDateShort(e.fecha)}</div>
      </div>
      <div class="flex-grow min-w-0">
        <p class="font-semibold text-slate-900 truncate">${e.artista} · ${e.ciudad}</p>
        <p class="text-sm text-slate-500 truncate">${e.productora || "—"} · ${e.responsable || "—"}</p>
      </div>
      <div class="flex-shrink-0">
        <span class="inline-block w-2 h-2 rounded-full bg-rose-500 pulse-urgent"></span>
      </div>
    </button>
  `;
}

function upcomingRow(e) {
  const d = daysUntil(e.fecha);
  const isUrgent = d >= 0 && d <= 7 && !isPreComplete(e);
  return `
    <button onclick="openEvent('${e.id}')" class="w-full text-left px-5 py-4 hover:bg-slate-50 transition flex items-center gap-4">
      <div class="flex-shrink-0 w-12 h-12 rounded-lg bg-gradient-to-br from-indigo-100 to-purple-100 flex flex-col items-center justify-center">
        <div class="text-[10px] font-bold text-purple-700 uppercase">${new Date(e.fecha+"T00:00:00").toLocaleDateString("es-AR",{month:"short"})}</div>
        <div class="text-lg font-bold text-purple-900 leading-none">${new Date(e.fecha+"T00:00:00").getDate()}</div>
      </div>
      <div class="flex-grow min-w-0">
        <p class="font-semibold text-slate-900 truncate">${e.artista}</p>
        <p class="text-sm text-slate-500 truncate">${e.ciudad}${e.productora?` · ${e.productora}`:""}</p>
      </div>
      <div class="flex-shrink-0 flex flex-col items-end gap-1">
        ${estadoBadge(e.estado)}
        ${isUrgent ? '<span class="text-[10px] text-rose-600 font-semibold"> revisar checklist</span>' : ''}
      </div>
    </button>
  `;
}

function postPendingRow(e) {
  const d = -daysUntil(e.fecha);
  return `
    <button onclick="openEvent('${e.id}')" class="w-full text-left px-5 py-3 hover:bg-amber-50 transition flex items-center gap-3">
      <div class="flex-shrink-0 text-xs text-amber-700 w-20">Hace ${d}d</div>
      <div class="flex-grow min-w-0">
        <p class="font-medium text-slate-900 text-sm truncate">${e.artista} · ${e.ciudad}</p>
        <p class="text-xs text-slate-500 truncate">${e.productora || "—"}</p>
      </div>
      <span class="text-xs text-amber-600 font-semibold">Pendiente</span>
    </button>
  `;
}

function estadoBadge(estado) {
  const map = {
    "Confirmado": "bg-indigo-100 text-indigo-700",
    "Finalizado": "bg-emerald-100 text-emerald-700",
    "Por confirmar": "bg-amber-100 text-amber-700"
  };
  return `<span class="inline-block px-2 py-0.5 rounded text-[10px] font-medium ${map[estado] || 'bg-slate-100 text-slate-600'}">${estado || '—'}</span>`;
}

/* ============================================================
   CALENDARIO
============================================================ */
let calFilters = { artista:"", estado:"", responsable:"", q:"" };

function renderCalendario() {
  const artistas = [...new Set(state.calendario.map(e=>e.artista))].sort();
  const responsables = [...new Set(state.calendario.map(e=>e.responsable).filter(Boolean))].sort();
  const filtered = state.calendario.filter(e => {
    if (calFilters.artista && e.artista !== calFilters.artista) return false;
    if (calFilters.estado && e.estado !== calFilters.estado) return false;
    if (calFilters.responsable && e.responsable !== calFilters.responsable) return false;
    if (calFilters.q) {
      const q = calFilters.q.toLowerCase();
      if (!`${e.artista} ${e.ciudad} ${e.productora||""} ${e.promotor||""}`.toLowerCase().includes(q)) return false;
    }
    return true;
  }).sort((a,b)=>a.fecha.localeCompare(b.fecha));

  // agrupar por mes
  const grouped = {};
  filtered.forEach(e => {
    const m = e.fecha.slice(0,7);
    (grouped[m] = grouped[m] || []).push(e);
  });

  return `
  <section class="space-y-4">
    <div class="flex items-center justify-between flex-wrap gap-2">
      <h2 class="text-2xl font-bold text-slate-900">Calendario</h2>
      <button onclick="openNewDate()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-semibold shadow">+ Nueva fecha</button>
    </div>

    <!-- Filtros -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 flex flex-wrap gap-3">
      <input id="calQ" type="text" placeholder="Buscar..." value="${calFilters.q}"
        oninput="calFilters.q=this.value;render()"
        class="flex-grow min-w-[180px] px-3 py-2 rounded-lg border border-slate-300 text-sm">
      <select onchange="calFilters.artista=this.value;render()" class="px-3 py-2 rounded-lg border border-slate-300 text-sm">
        <option value="">Todos los artistas</option>
        ${artistas.map(a=>`<option ${calFilters.artista===a?'selected':''} value="${a}">${a}</option>`).join("")}
      </select>
      <select onchange="calFilters.estado=this.value;render()" class="px-3 py-2 rounded-lg border border-slate-300 text-sm">
        <option value="">Todos los estados</option>
        <option ${calFilters.estado==="Confirmado"?'selected':''}>Confirmado</option>
        <option ${calFilters.estado==="Finalizado"?'selected':''}>Finalizado</option>
        <option ${calFilters.estado==="Por confirmar"?'selected':''}>Por confirmar</option>
      </select>
      <select onchange="calFilters.responsable=this.value;render()" class="px-3 py-2 rounded-lg border border-slate-300 text-sm">
        <option value="">Todos los responsables</option>
        ${responsables.map(r=>`<option ${calFilters.responsable===r?'selected':''} value="${r}">${r}</option>`).join("")}
      </select>
    </div>

    <p class="text-sm text-slate-500">${filtered.length} fecha${filtered.length!==1?'s':''}</p>

    ${Object.keys(grouped).sort().map(m => {
      const date = new Date(m+"-01T00:00:00");
      const monthName = date.toLocaleDateString("es-AR",{month:"long",year:"numeric"});
      return `
        <div class="space-y-2">
          <h3 class="text-sm font-bold text-slate-500 uppercase tracking-wider sticky top-32 bg-slate-50 py-2 z-10">${monthName}</h3>
          <div class="bg-white rounded-xl shadow-sm border border-slate-200 divide-y divide-slate-100">
            ${grouped[m].map(e => calendarRow(e)).join("")}
          </div>
        </div>
      `;
    }).join("")}
    ${filtered.length === 0 ? '<p class="text-center text-slate-400 py-12">Sin resultados con esos filtros.</p>' : ''}
  </section>
  `;
}

function calendarRow(e) {
  const d = daysUntil(e.fecha);
  const urgent = e.estado !== "Finalizado" && d >= 0 && d <= 7 && !isPreComplete(e);
  const pre = preProgress(e);
  const post = postProgress(e);
  return `
    <button onclick="openEvent('${e.id}')" class="w-full text-left px-4 sm:px-5 py-4 hover:bg-slate-50 transition flex items-center gap-4 ${urgent?'bg-rose-50':''}">
      <div class="flex-shrink-0 w-14">
        <div class="text-xs text-slate-500 uppercase font-semibold">${new Date(e.fecha+"T00:00:00").toLocaleDateString("es-AR",{weekday:"short"})}</div>
        <div class="text-2xl font-bold text-slate-900">${new Date(e.fecha+"T00:00:00").getDate()}</div>
      </div>
      <div class="flex-grow min-w-0">
        <div class="flex items-center gap-2 flex-wrap">
          <p class="font-semibold text-slate-900">${e.artista}</p>
          ${estadoBadge(e.estado)}
          ${urgent ? '<span class="text-[10px] px-2 py-0.5 rounded bg-rose-600 text-white font-semibold">URGENTE</span>' : ''}
        </div>
        <p class="text-sm text-slate-500 mt-0.5">${e.ciudad}${e.productora?` · ${e.productora}`:""}${e.promotor?` · ${e.promotor}`:""}</p>
        <div class="flex items-center gap-3 mt-2 text-xs text-slate-500">
          ${e.oferta ? `<span> ${e.oferta}</span>` : ''}
          ${e.responsable ? `<span> ${e.responsable}</span>` : ''}
          ${e.estado !== 'Finalizado' && d >= 0 ? `<span class="font-semibold text-indigo-600">Pre-evento ${pre.done}/${pre.total}</span>` : ''}
          ${d < 0 ? `<span class="font-semibold text-amber-600">Post ${post.done}/${post.total}</span>` : ''}
        </div>
      </div>
    </button>
  `;
}

function preProgress(e) {
  const reqs = PRE_CHECKLIST.filter(i => !i.optional);
  const done = reqs.filter(i => {
    const v = (e.checklistPre||{})[i.key];
    return i.type === "check" ? v === true : (v && String(v).trim().length > 0);
  }).length;
  return { done, total: reqs.length };
}
function postProgress(e) {
  const done = POST_CHECKLIST.filter(i => {
    const v = (e.checklistPost||{})[i.key];
    return i.type === "check" ? v === true : (v && String(v).trim().length > 0);
  }).length;
  return { done, total: POST_CHECKLIST.length };
}

/* ============================================================
   SEGUIMIENTO — feed + tabla + log de actualizaciones
============================================================ */
let segView = "feed"; // "feed" | "tabla"
let segFilter = { encargado:"", estado:"", prioridad:"", artista:"", q:"" };

function lastUpdateOf(oppId) {
  return state.updates
    .filter(u => u.oppId === oppId)
    .sort((a,b) => b.timestamp.localeCompare(a.timestamp))[0];
}
function daysSince(iso) {
  return Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
}

function renderSeguimiento() {
  const updatesThisWeek = state.updates.filter(u => Date.now() - new Date(u.timestamp).getTime() < 7*86400000).length;
  const activeOpps = state.pipeline.length;
  const stale = state.pipeline.filter(p => {
    const last = lastUpdateOf(p.id);
    if (!last) return true;
    return daysSince(last.timestamp) > 14;
  });
  const recentUpdates = [...state.updates].sort((a,b)=>b.timestamp.localeCompare(a.timestamp));

  return `
  <section class="space-y-4">
    <div class="flex items-center justify-between flex-wrap gap-2">
      <h2 class="text-2xl font-bold text-slate-900">Seguimiento de fechas</h2>
      <div class="flex gap-2">
        <div class="bg-white rounded-lg border border-slate-200 p-1 flex">
          <button onclick="segView='feed';render()" class="px-3 py-1.5 rounded text-sm font-medium ${segView==='feed'?'bg-indigo-600 text-white':'text-slate-600'}"> Feed</button>
          <button onclick="segView='tabla';render()" class="px-3 py-1.5 rounded text-sm font-medium ${segView==='tabla'?'bg-indigo-600 text-white':'text-slate-600'}"> Tabla</button>
        </div>
        <button onclick="openUpdateModal()" class="bg-emerald-500 hover:bg-emerald-600 text-white px-4 py-2 rounded-lg text-sm font-semibold shadow flex items-center gap-2">
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M20.52 3.48A11.78 11.78 0 0012 0a12 12 0 00-10.27 18.07L0 24l6.13-1.6A12 12 0 0024 12a11.78 11.78 0 00-3.48-8.52zM12 22a10 10 0 01-5.1-1.4l-.36-.21-3.64.95.97-3.55-.23-.37A10 10 0 1122 12a10 10 0 01-10 10z"/></svg>
          Nueva actualización
        </button>
      </div>
    </div>

    <!-- Stats -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
      ${segStat("Updates esta semana", updatesThisWeek, "indigo", "")}
      ${segStat("Oportunidades activas", activeOpps, "purple", "")}
      ${segStat("Sin contacto >14 días", stale.length, "rose", "")}
      ${segStat("Actualizaciones totales", state.updates.length, "emerald", "")}
    </div>

    ${segView === "feed" ? renderSeguimientoFeed(recentUpdates, stale) : renderSeguimientoTabla()}
  </section>
  `;
}

function segStat(label, val, color, icon) {
  const colors = {
    indigo: "from-indigo-500 to-indigo-600",
    purple: "from-purple-500 to-purple-600",
    rose: "from-rose-500 to-rose-600",
    emerald: "from-emerald-500 to-emerald-600"
  };
  return `
    <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-200 card-hover">
      <div class="flex items-center justify-between mb-2">
        <span class="text-2xl">${icon}</span>
        <span class="text-xs font-medium text-slate-500 text-right">${label}</span>
      </div>
      <p class="text-3xl font-bold bg-gradient-to-br ${colors[color]} bg-clip-text text-transparent">${val}</p>
    </div>
  `;
}

function renderSeguimientoFeed(recentUpdates, stale) {
  return `
  <div class="grid lg:grid-cols-3 gap-4">
    <!-- Feed (2/3) -->
    <div class="lg:col-span-2 space-y-3">
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
        <div class="px-5 py-3 border-b border-slate-100 flex items-center justify-between">
          <h3 class="font-bold text-slate-800">Últimas actualizaciones</h3>
          <span class="text-xs text-slate-500">${recentUpdates.length} en total</span>
        </div>
        <div class="divide-y divide-slate-100 max-h-[700px] overflow-y-auto">
          ${recentUpdates.length === 0 ? '<p class="px-5 py-12 text-center text-slate-400">Aún no hay actualizaciones registradas.</p>' :
            recentUpdates.map(u => updateCard(u)).join("")}
        </div>
      </div>
    </div>

    <!-- Sidebar (1/3): retomar contacto -->
    <div class="space-y-3">
      <div class="bg-white rounded-xl shadow-sm border border-rose-200 overflow-hidden">
        <div class="bg-gradient-to-r from-rose-500 to-orange-500 text-white px-5 py-3 flex items-center gap-2">
          <span class="text-xl"></span>
          <h3 class="font-bold">Retomar contacto</h3>
        </div>
        <div class="divide-y divide-slate-100 max-h-[600px] overflow-y-auto">
          ${stale.length === 0 ? '<p class="px-5 py-8 text-center text-slate-400 text-sm">¡Todo al día!</p>' :
            stale.slice(0, 20).map(p => staleOppCard(p)).join("")}
        </div>
      </div>
    </div>
  </div>
  `;
}

function updateCard(u) {
  const opp = state.pipeline.find(p => p.id === u.oppId);
  const date = new Date(u.timestamp);
  const ago = daysSince(u.timestamp);
  const agoLbl = ago === 0 ? "Hoy" : ago === 1 ? "Ayer" : `Hace ${ago}d`;
  const userColor = u.encargado === "Rama" ? "from-purple-400 to-pink-400" : u.encargado === "Juanfra" ? "from-orange-400 to-pink-400" : u.encargado === "EL DJ" ? "from-blue-400 to-cyan-400" : "from-slate-400 to-slate-500";
  const initials = (u.encargado || "?").split(" ").map(s=>s[0]).slice(0,2).join("").toUpperCase();
  return `
    <button onclick="openOpportunity('${u.oppId}')" class="w-full text-left px-5 py-4 hover:bg-slate-50 transition flex gap-3">
      <div class="flex-shrink-0 w-10 h-10 rounded-full bg-gradient-to-br ${userColor} flex items-center justify-center text-white font-bold text-sm">${initials}</div>
      <div class="flex-grow min-w-0">
        <div class="flex items-center gap-2 flex-wrap text-xs">
          <span class="font-semibold text-slate-900">${u.encargado}</span>
          <span class="text-slate-400">·</span>
          <span class="text-slate-500">${agoLbl}</span>
          <span class="text-slate-400">·</span>
          <span class="text-slate-500">${date.toLocaleDateString("es-AR",{day:"2-digit",month:"short"})}</span>
        </div>
        <div class="mt-1 flex items-center gap-2 flex-wrap text-sm">
          <span class="font-bold text-indigo-700">${opp?.artista || "—"}</span>
          <span class="text-slate-400">→</span>
          <span class="text-slate-700">${opp?.productora || "—"}${opp?.ciudad?` (${opp.ciudad})`:""}</span>
          ${opp?.estado ? pipelineEstadoBadge(opp.estado) : ''}
          ${opp?.prioridad ? prioridadBadge(opp.prioridad) : ''}
        </div>
        ${u.contacto ? `<p class="text-xs text-slate-500 mt-1"> Contacto: ${u.contacto}</p>` : ''}
        <p class="text-sm text-slate-700 mt-2 leading-relaxed">${u.comentario}</p>
      </div>
    </button>
  `;
}

function staleOppCard(p) {
  const last = lastUpdateOf(p.id);
  const days = last ? daysSince(last.timestamp) : 999;
  const dayLbl = days >= 999 ? "sin contacto" : `${days}d`;
  return `
    <button onclick="openOpportunity('${p.id}')" class="w-full text-left px-4 py-3 hover:bg-rose-50 transition">
      <div class="flex items-center justify-between gap-2 mb-1">
        <span class="font-semibold text-sm text-slate-900 truncate">${p.artista}</span>
        <span class="text-[10px] font-bold text-rose-600 flex-shrink-0">${dayLbl}</span>
      </div>
      <p class="text-xs text-slate-600 truncate">${p.productora || "—"}${p.ciudad?` · ${p.ciudad}`:""}</p>
      <div class="flex items-center gap-1 mt-1">
        ${p.prioridad ? prioridadBadge(p.prioridad) : ''}
        ${p.encargado ? `<span class="text-[10px] text-slate-500">· ${p.encargado}</span>` : ''}
      </div>
    </button>
  `;
}

function renderSeguimientoTabla() {

function parseWhatsApp() {
  const txt = document.getElementById("waText").value.trim();
  if (!txt) return;
  // Heurística simple: separar por " - " o " — "
  const parts = txt.split(/\s+[-–—]\s+/);
  if (parts.length >= 1) {
    // Primer parte: artista (matchear con roster)
    const candArtist = parts[0].trim();
    const matchArt = SEED.artistas.find(a => a.nombre.toLowerCase() === candArtist.toLowerCase()) ||
                     SEED.artistas.find(a => candArtist.toLowerCase().includes(a.nombre.toLowerCase().split(" ")[0]));
    if (matchArt) upData.artista = matchArt.nombre;
  }
  if (parts.length >= 2) {
    // Segunda parte: productora + ciudad
    const second = parts[1].trim();
    // Buscar productora del catálogo
    const matchVenue = SEED.venues.find(v => second.toLowerCase().includes(v.nombre.toLowerCase()));
    if (matchVenue) {
      upData.productora = matchVenue.nombre;
      // Lo que sobra es ciudad
      const rest = second.replace(new RegExp(matchVenue.nombre, "i"), "").trim();
      if (rest) upData.ciudad = rest;
      else if (matchVenue.ciudad) upData.ciudad = matchVenue.ciudad;
    } else {
      // dividir por espacios: primera palabra productora, resto ciudad (heurística)
      const tokens = second.split(/\s+/);
      if (tokens.length === 1) upData.productora = tokens[0];
      else { upData.productora = tokens[0]; upData.ciudad = tokens.slice(1).join(" "); }
    }
  }
  // Comentario = todo lo demás (parts.slice(2)) o el texto completo si no se pudo separar
  if (parts.length >= 3) {
    upData.comentario = parts.slice(2).join(" — ").trim();
  } else if (parts.length < 2) {
    upData.comentario = txt;
  }
  // Detectar mes en el texto
  const meses = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
  const lc = txt.toLowerCase();
  const mesEncontrado = meses.find(m => lc.includes(m));
  if (mesEncontrado) upData.mes = mesEncontrado.charAt(0).toUpperCase() + mesEncontrado.slice(1);
  // Detectar prioridad (matchea "prioridad alta", "prioridad es alta", "alta prioridad", etc)
  if (/(prioridad(\s+es)?\s+alta|alta\s+prioridad|urgente)/.test(lc)) upData.prioridad = "Alta";
  else if (/(prioridad(\s+es)?\s+media|media\s+prioridad)/.test(lc)) upData.prioridad = "Media";
  else if (/(prioridad(\s+es)?\s+baja|baja\s+prioridad)/.test(lc)) upData.prioridad = "Baja";
  // Detectar nombre de contacto: buscar "X (promotor)" o "X dijo" o "X me dijo"
  const contactMatch = txt.match(/\b([A-ZÁÉÍÓÚÑ][a-záéíóúñ]+)\s+(?:\(promotor\)|dijo|me dijo|comentó|avisó)/);
  if (contactMatch) upData.contacto = contactMatch[1];

  toast(" Auto-completado — revisá los campos");
  renderUpdateModal();
}

function saveUpdate() {
  // Capturar valores actuales
  const $ = id => document.getElementById(id)?.value || "";
  upData.artista = $("up_artista") || upData.artista;
  upData.productora = $("up_productora") || upData.productora;
  upData.ciudad = $("up_ciudad") || upData.ciudad;
  upData.mes = $("up_mes") || upData.mes;
  upData.contacto = $("up_contacto") || upData.contacto;
  upData.comentario = $("up_comentario") || upData.comentario;

  if (!upData.artista) { toast("Falta el artista"); return; }
  if (!upData.comentario) { toast("Falta el comentario"); return; }
  if (!upData.encargado) { toast("Indicá el encargado"); return; }

  let oppId = upTargetOppId;
  // Si no hay target, buscar oportunidad existente con mismo artista + productora
  if (!oppId) {
    const existing = state.pipeline.find(p =>
      p.artista === upData.artista &&
      (p.productora||"").toLowerCase() === (upData.productora||"").toLowerCase() &&
      (upData.productora || "")
    );
    if (existing) {
      oppId = existing.id;
      // actualizar campos de la oportunidad si vinieron nuevos
      if (upData.estado) existing.estado = upData.estado;
      if (upData.prioridad) existing.prioridad = upData.prioridad;
      if (upData.contacto) existing.contacto = upData.contacto;
      if (upData.mes) existing.mes = upData.mes;
      if (upData.encargado) existing.encargado = upData.encargado;
    } else {
      // crear nueva oportunidad
      oppId = "p" + Date.now();
      state.pipeline.push({
        id: oppId,
        artista: upData.artista,
        productora: upData.productora || "",
        ciudad: upData.ciudad || "",
        mes: upData.mes || "",
        encargado: upData.encargado,
        estado: upData.estado || "Consultar",
        prioridad: upData.prioridad || "Media",
        contacto: upData.contacto || ""
      });
    }
  } else {
    // actualizar oportunidad existente
    const opp = state.pipeline.find(p => p.id === oppId);
    if (opp) {
      if (upData.estado) opp.estado = upData.estado;
      if (upData.prioridad) opp.prioridad = upData.prioridad;
      if (upData.contacto) opp.contacto = upData.contacto;
      if (upData.mes) opp.mes = upData.mes;
    }
  }

  // Crear update
  state.updates.push({
    id: "u" + Date.now(),
    oppId,
    timestamp: new Date().toISOString(),
    encargado: upData.encargado,
    contacto: upData.contacto,
    comentario: upData.comentario
  });
  saveState();
  toast("✓ Actualización registrada");
  closeUpdateModal();
  render();
}

function sendToWhatsApp() {
  const $ = id => document.getElementById(id)?.value || "";
  const artista = $("up_artista") || upData.artista || "";
  const productora = $("up_productora") || upData.productora || "";
  const ciudad = $("up_ciudad") || upData.ciudad || "";
  const mes = $("up_mes") || upData.mes || "";
  const estado = upData.estado || "";
  const prioridad = upData.prioridad || "";
  const contacto = $("up_contacto") || upData.contacto || "";
  const coment = $("up_comentario") || upData.comentario || "";
  const encargado = upData.encargado || "";

  const msg = `*${artista}* — ${productora}${ciudad?` (${ciudad})`:""}\n` +
              `${mes?` ${mes} | `:""}${estado?` ${estado}`:""}${prioridad?` |  ${prioridad}`:""}\n` +
              `${contacto?` ${contacto}\n`:""}` +
              `\n${coment}\n\n_— ${encargado}_`;

  const encoded = encodeURIComponent(msg);
  window.open(`https://wa.me/?text=${encoded}`, "_blank");
}

          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M20.52 3.48A11.78 11.78 0 0012 0a12 12 0 00-10.27 18.07L0 24l6.13-1.6A12 12 0 0024 12a11.78 11.78 0 00-3.48-8.52z"/></svg>
          Sumar actualización
        </button>
        <button onclick="if(confirm('¿Eliminar esta oportunidad y su historial?'))deleteOpportunity('${opp.id}')" class="px-4 py-2 rounded-lg text-sm font-medium text-rose-600 hover:bg-rose-50">Eliminar</button>
      </div>

      <!-- Timeline -->
      <div>
        <h3 class="font-bold text-slate-900 mb-3 flex items-center gap-2">
          <span></span> Historial de contacto (${ups.length})
        </h3>
        ${ups.length === 0 ? '<p class="text-sm text-slate-400 italic">Sin actualizaciones registradas. Sumá la primera con el botón de arriba.</p>' :
        `<div class="space-y-3">
          ${ups.map(u => {
            const date = new Date(u.timestamp);
            const ago = daysSince(u.timestamp);
            const agoLbl = ago === 0 ? "Hoy" : ago === 1 ? "Ayer" : `Hace ${ago}d`;
            const userColor = u.encargado === "Rama" ? "from-purple-400 to-pink-400" : u.encargado === "Juanfra" ? "from-orange-400 to-pink-400" : "from-blue-400 to-cyan-400";
            const initials = (u.encargado||"?").split(" ").map(s=>s[0]).slice(0,2).join("").toUpperCase();
            return `
            <div class="bg-slate-50 rounded-lg p-4 border-l-4 border-emerald-400">
              <div class="flex items-center gap-2 mb-2">
                <div class="w-7 h-7 rounded-full bg-gradient-to-br ${userColor} flex items-center justify-center text-white font-bold text-xs">${initials}</div>
                <span class="font-semibold text-sm text-slate-900">${u.encargado}</span>
                <span class="text-xs text-slate-400">·</span>
                <span class="text-xs text-slate-500">${agoLbl} · ${date.toLocaleDateString("es-AR",{day:"2-digit",month:"short",year:"numeric"})} ${date.toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"})}</span>
                ${u.contacto ? `<span class="ml-auto text-xs text-slate-500"> ${u.contacto}</span>` : ''}
              </div>
              <p class="text-sm text-slate-700 leading-relaxed whitespace-pre-wrap">${u.comentario}</p>
            </div>
          `;}).join("")}
        </div>`}
      </div>
    </div>
  `;
}

function deleteOpportunity(oppId) {
  state.pipeline = state.pipeline.filter(p => p.id !== oppId);
  state.updates = state.updates.filter(u => u.oppId !== oppId);
  // si había planner targets enlazados, los desvinculo (no los borro)
  state.planner.forEach(t => { if (t.oppId === oppId) t.oppId = null; });
  saveState();
  closeOpportunity();
  toast("Oportunidad eliminada");
  render();
}

/* ============================================================
   PLANNER ANUAL — vista por artista, grid de 12 meses
============================================================ */
let plannerArtist = null;
let plannerYear = 2026;

const MESES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const MESES_SHORT = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];

function openPlanner(artistName) {
  plannerArtist = artistName;
  plannerYear = new Date().getFullYear();
  if (plannerYear < 2026) plannerYear = 2026;
  document.getElementById("plannerModal").classList.remove("hidden");
  renderPlannerModal();
}
function closePlanner() {
  document.getElementById("plannerModal").classList.add("hidden");
}

function renderPlannerModal() {
  const artist = SEED.artistas.find(a => a.nombre === plannerArtist);
  if (!artist) return;

  const targets = state.planner.filter(t => t.artista === plannerArtist && t.year === plannerYear);
  const confirmedDates = state.calendario.filter(e =>
    e.artista === plannerArtist &&
    e.fecha.startsWith(String(plannerYear)) &&
    (e.estado === "Confirmado" || e.estado === "Finalizado" || e.estado === "Por confirmar")
  );

  // Stats
  const totalObj = targets.length;
  const alcanzados = targets.filter(t => t.status === "alcanzado").length;
  const enProceso = targets.filter(t => t.status === "contactado" || t.status === "confirmado").length;
  const totalConf = confirmedDates.filter(e => e.estado === "Confirmado").length;

  document.getElementById("plannerModalContent").innerHTML = `
    <div class="gradient-bg text-white px-6 py-5 rounded-t-2xl flex justify-between items-center flex-wrap gap-3">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-indigo-400 to-purple-500 flex items-center justify-center font-bold">
          ${artist.nombre.split(' ').map(s=>s[0]).slice(0,2).join('')}
        </div>
        <div>
          <h2 class="font-bold text-xl">Plan anual · ${artist.nombre}</h2>
          <p class="text-xs text-indigo-200">${artist.genero || ""}</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="plannerYear--;renderPlannerModal()" class="w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center">‹</button>
        <span class="font-bold text-2xl mx-2">${plannerYear}</span>
        <button onclick="plannerYear++;renderPlannerModal()" class="w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center">›</button>
        <button onclick="closePlanner()" class="ml-3 text-white/70 hover:text-white text-2xl leading-none">&times;</button>
      </div>
    </div>

    <div class="p-5 sm:p-6 space-y-4">
      <!-- Stats -->
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
        <div class="bg-indigo-50 rounded-lg p-3 border border-indigo-200">
          <div class="text-[10px] uppercase text-indigo-600 font-semibold">Objetivos</div>
          <div class="text-2xl font-bold text-indigo-700">${totalObj}</div>
        </div>
        <div class="bg-amber-50 rounded-lg p-3 border border-amber-200">
          <div class="text-[10px] uppercase text-amber-600 font-semibold">En proceso</div>
          <div class="text-2xl font-bold text-amber-700">${enProceso}</div>
        </div>
        <div class="bg-emerald-50 rounded-lg p-3 border border-emerald-200">
          <div class="text-[10px] uppercase text-emerald-600 font-semibold">Alcanzados</div>
          <div class="text-2xl font-bold text-emerald-700">${alcanzados}</div>
        </div>
        <div class="bg-purple-50 rounded-lg p-3 border border-purple-200">
          <div class="text-[10px] uppercase text-purple-600 font-semibold">Fechas reales</div>
          <div class="text-2xl font-bold text-purple-700">${confirmedDates.length}</div>
        </div>
      </div>

      <!-- Leyenda -->
      <div class="flex items-center gap-4 flex-wrap text-xs text-slate-600 bg-slate-50 p-2.5 rounded-lg">
        <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-amber-400"></span>Tentativo</span>
        <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-blue-400"></span>Contactado</span>
        <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-indigo-500"></span>Confirmado</span>
        <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>Alcanzado</span>
        <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-purple-500"></span>Fecha del calendario</span>
      </div>

      <!-- Grid 12 meses -->
      <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-3 max-h-[60vh] overflow-y-auto pr-1">
        ${MESES.map((mesName, idx) => renderMonthCard(idx+1, mesName, targets, confirmedDates)).join("")}
      </div>

      ${totalObj === 0 ? `
      <div class="bg-indigo-50 border-2 border-dashed border-indigo-300 rounded-lg p-5 text-center">
        <p class="text-sm text-indigo-900 font-medium"> Aún no hay objetivos planificados para ${artist.nombre} en ${plannerYear}</p>
        <p class="text-xs text-indigo-700 mt-1">Hacé click en "+ Sumar objetivo" en cualquier mes para empezar.</p>
      </div>` : ''}
    </div>

function renderMonthCard(monthNum, monthName, targets, confirmedDates) {
  const monthTargets = targets.filter(t => t.month === monthNum);
  const monthConfirmed = confirmedDates.filter(e => parseInt(e.fecha.slice(5,7)) === monthNum);
  const today = new Date();
  const isCurrent = plannerYear === today.getFullYear() && (monthNum-1) === today.getMonth();
  const isPast = plannerYear < today.getFullYear() || (plannerYear === today.getFullYear() && monthNum < today.getMonth()+1);

  return `
    <div class="bg-white rounded-xl border-2 ${isCurrent?'border-indigo-400':'border-slate-200'} ${isPast?'opacity-70':''} overflow-hidden">
      <div class="px-3 py-2 bg-slate-50 border-b border-slate-200 flex items-center justify-between">
        <h4 class="font-bold text-sm text-slate-800">${monthName}${isCurrent?' <span class="text-[10px] text-indigo-600">· actual</span>':''}</h4>
        <span class="text-xs text-slate-500">${monthTargets.length + monthConfirmed.length}</span>
      </div>
      <div class="p-2 space-y-1.5 min-h-[100px]">
        ${monthConfirmed.map(e => `
          <div class="bg-purple-50 border-l-4 border-purple-500 rounded px-2 py-1.5 text-xs">
            <div class="flex items-center justify-between gap-1">
              <span class="font-bold text-purple-900">${new Date(e.fecha+'T00:00:00').getDate()} ${MESES_SHORT[parseInt(e.fecha.slice(5,7))-1]}</span>
              ${estadoBadge(e.estado)}
            </div>
            <p class="text-slate-700 truncate mt-0.5">${e.ciudad}${e.productora?` · ${e.productora}`:""}</p>
          </div>
        `).join("")}
        ${monthTargets.map(t => targetCard(t)).join("")}
        <button onclick="openTargetEditor('${plannerArtist.replace(/'/g,"\\'")}',${plannerYear},${monthNum})"
          class="w-full text-xs text-indigo-600 hover:bg-indigo-50 border border-dashed border-indigo-300 rounded py-1.5 font-medium transition">
          + Sumar objetivo
        </button>
      </div>
    </div>
  `;
}

function targetCard(t) {
  const colors = {
    tentativa:  { bg:"bg-amber-50",   border:"border-amber-400",   dot:"bg-amber-400" },
    contactado: { bg:"bg-blue-50",    border:"border-blue-400",    dot:"bg-blue-400" },
    confirmado: { bg:"bg-indigo-50",  border:"border-indigo-500",  dot:"bg-indigo-500" },
    alcanzado:  { bg:"bg-emerald-50", border:"border-emerald-500", dot:"bg-emerald-500" }
  };
  const c = colors[t.status] || colors.tentativa;
  const linked = t.oppId ? state.pipeline.find(p => p.id === t.oppId) : null;
  return `
    <button onclick="openTargetEditor(null,null,null,'${t.id}')"
      class="w-full text-left ${c.bg} border-l-4 ${c.border} rounded px-2 py-1.5 text-xs hover:shadow-sm transition">
      <div class="flex items-center gap-1.5 mb-0.5">
        <span class="w-2 h-2 rounded-full ${c.dot}"></span>
        <span class="font-semibold text-slate-900 truncate flex-grow">${t.productora || t.ciudad || "Objetivo"}</span>
        ${t.prioridad === "Alta" ? '<span class="text-[9px] font-bold text-red-600"></span>' : ''}
      </div>
      ${t.ciudad && t.productora ? `<p class="text-slate-600 truncate">${t.ciudad}</p>` : ''}
      ${t.contacto ? `<p class="text-slate-500 truncate"> ${t.contacto}</p>` : ''}
      ${linked ? `<p class="text-[10px] text-indigo-600 mt-1"> Vinculado a pipeline</p>` : ''}
    </button>
  `;
}

    tgtData = { ...existing };
    tgtEditingId = targetId;
  } else {
    tgtData = {
      id: "t" + Date.now(),
      artista: artist || plannerArtist,
      year: year || plannerYear,
      month: month || (new Date().getMonth()+1),
      status: "tentativa",
      prioridad: "Media",
      productora: "",
      ciudad: "",
      contacto: "",
      notas: ""
    };
    tgtEditingId = null;
  }
  document.getElementById("targetModal").classList.remove("hidden");
  renderTargetEditor();
}
function closeTargetEditor() {
  document.getElementById("targetModal").classList.add("hidden");
  tgtEditingId = null;
}

          <datalist id="tgtVenues">${venuesList}</datalist>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Ciudad / Zona</label>

        </div>
      </div>

      <!-- Contacto -->
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Contacto del promotor</label>
        <input id="tgt_contacto" type="text" value="${tgtData.contacto||''}" oninput="tgtData.contacto=this.value" class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm" placeholder="Nombre del promotor o liaison">
      </div>

      <!-- Estado del objetivo -->
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-2">Estado del objetivo</label>
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
          ${[
            {k:"tentativa",  label:"Tentativo",  active:"border-amber-500 bg-amber-50 text-amber-700"},
            {k:"contactado", label:"Contactado", active:"border-blue-500 bg-blue-50 text-blue-700"},
            {k:"confirmado", label:"Confirmado", active:"border-indigo-500 bg-indigo-50 text-indigo-700"},

            <option value="">— Sin vincular —</option>
            ${oppsArtist.map(o=>`<option value="${o.id}" ${tgtData.oppId===o.id?'selected':''}>${o.productora||'—'} · ${o.ciudad||'—'} (${o.estado||'sin estado'})</option>`).join("")}

          <button onclick="closeTargetEditor()" class="px-4 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100">Cancelar</button>
          <button onclick="saveTarget()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-lg text-sm font-semibold shadow">✓ Guardar</button>
        </div>
      </div>
    </div>

function autofillFromVenue(name) {
  // Si el nombre coincide con un venue, autocompletar ciudad y contacto
  const v = SEED.venues.find(x => x.nombre.toLowerCase() === name.toLowerCase());
  if (v) {
    if (!tgtData.ciudad && v.ciudad) {
      tgtData.ciudad = v.ciudad;
      const ci = document.getElementById("tgt_ciudad");
      if (ci) ci.value = v.ciudad;
    }
    if (!tgtData.contacto && v.contacto) {
      tgtData.contacto = v.contacto;
      const co = document.getElementById("tgt_contacto");
      if (co) co.value = v.contacto;
    }
  }
}

function saveTarget() {
  // capturar valores actuales
  const $ = id => document.getElementById(id)?.value || "";
  tgtData.productora = $("tgt_prod") || tgtData.productora;
  tgtData.ciudad = $("tgt_ciudad") || tgtData.ciudad;
  tgtData.contacto = $("tgt_contacto") || tgtData.contacto;
  tgtData.notas = $("tgt_notas") || tgtData.notas;

  if (!tgtData.productora && !tgtData.ciudad) {
    toast("Indicá al menos productora o ciudad");
    return;
  }

  if (tgtEditingId) {
    const idx = state.planner.findIndex(t => t.id === tgtEditingId);
    if (idx >= 0) state.planner[idx] = { ...tgtData };
  } else {
    state.planner.push({ ...tgtData });
  }
  saveState();
  closeTargetEditor();
  toast(tgtEditingId ? "Objetivo actualizado" : "Objetivo agregado");
  renderPlannerModal();
  // si el roster está abierto, refrescar contador
  if (currentTab === "roster") render();
}

function deleteTarget(id) {
  state.planner = state.planner.filter(t => t.id !== id);
  saveState();
  closeTargetEditor();
  toast("Objetivo eliminado");
  renderPlannerModal();
  if (currentTab === "roster") render();
}

            <div class="bg-emerald-50 rounded-lg py-2">
              <div class="text-[10px] text-emerald-600 uppercase">Ideal</div>
              <div class="text-xs font-bold text-emerald-700">${a.moneda==="USD"?"$":""}${a.feeIdeal.toLocaleString("es-AR")}</div>
            </div>
          </div>` : '<div class="mt-4 text-xs text-slate-400 italic">Fees sin definir</div>'}
          <div class="mt-4 flex items-center justify-between text-xs text-slate-600">
            <span> ${proximas} próximas</span>
            <span> ${realizadas} realizadas</span>
            <span> ${state.planner.filter(t=>t.artista===a.nombre).length} objetivos</span>
          </div>
          <button onclick="openPlanner('${a.nombre.replace(/'/g,"\\'")}')" class="mt-3 w-full bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white px-3 py-2 rounded-lg text-xs font-semibold shadow flex items-center justify-center gap-1.5">
            <span></span> Ver plan anual
          </button>
          ${a.ig ? `<a href="https://instagram.com/${a.ig}" target="_blank" class="mt-2 block text-center text-xs text-indigo-600 hover:underline">@${a.ig}</a>` : ''}
        </div>
        `;
      }).join("")}
    </div>
  </section>
  `;
}

/* ============================================================
   VENUES
============================================================ */
let venueQ = "";
function renderVenues() {
  const filtered = SEED.venues.filter(v => {
    if (!venueQ) return true;
    const q = venueQ.toLowerCase();
    return `${v.nombre} ${v.ciudad||""} ${v.tipo||""} ${v.contacto||""}`.toLowerCase().includes(q);
  });
  return `
  <section class="space-y-4">
    <div class="flex items-center justify-between flex-wrap gap-2">
      <h2 class="text-2xl font-bold text-slate-900">Venues & Productoras</h2>
      <input value="${venueQ}" oninput="venueQ=this.value;render()" placeholder="Buscar..." class="px-3 py-2 rounded-lg border border-slate-300 text-sm w-full sm:w-72">
    </div>
    <p class="text-sm text-slate-500">${filtered.length} de ${SEED.venues.length}</p>
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden overflow-x-auto">
      <table class="min-w-full text-sm">
        <thead class="bg-slate-50 text-xs text-slate-500 uppercase">
          <tr>
            <th class="text-left px-4 py-2">Nombre</th>
            <th class="text-left px-4 py-2">Ciudad</th>
            <th class="text-left px-4 py-2">Tipo</th>
            <th class="text-left px-4 py-2">Contacto</th>
            <th class="text-left px-4 py-2">Géneros</th>
            <th class="text-left px-4 py-2">IG</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-100">
          ${filtered.map(v => `
            <tr class="hover:bg-slate-50">
              <td class="px-4 py-3 font-medium text-slate-900">${v.nombre}</td>
              <td class="px-4 py-3 text-slate-600">${v.ciudad || "—"}</td>
              <td class="px-4 py-3 text-xs text-slate-500">${v.tipo || "—"}</td>
              <td class="px-4 py-3 text-xs text-slate-600">${v.contacto || "—"}</td>
              <td class="px-4 py-3 text-xs text-slate-500">${v.generos || "—"}</td>
              <td class="px-4 py-3 text-xs">${v.ig ? `<a href="https://instagram.com/${v.ig}" target="_blank" class="text-indigo-600 hover:underline">@${v.ig}</a>` : "—"}</td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    </div>
  </section>
  `;
}

/* ============================================================
   WIZARD — agendar nueva fecha
============================================================ */
let wizStep = 1;
const WIZ_STEPS = 6;
let wizData = {};

function openNewDate() {
  wizStep = 1;
  wizData = { id: "e" + Date.now(), checklistPre: {}, checklistPost: {}, gastos: 0 };
  document.getElementById("wizardModal").classList.remove("hidden");
  renderWizard();
}
function closeWizard() {
  document.getElementById("wizardModal").classList.add("hidden");
}

function renderWizard() {
  document.getElementById("stepNum").textContent = wizStep;
  // dots
  const dots = document.getElementById("stepDots");
  dots.innerHTML = "";
  for (let i=1; i<=WIZ_STEPS; i++) {
    const d = document.createElement("div");
    d.className = "step-dot flex-1 h-1.5 rounded-full bg-slate-200" + (i < wizStep ? " done" : i === wizStep ? " active" : "");
    if (i < wizStep) d.style.background = "#10b981";
    if (i === wizStep) d.style.background = "#6366f1";
    dots.appendChild(d);
  }
  // body
  const body = document.getElementById("wizardBody");
  body.innerHTML = wizardStep(wizStep);
  // buttons
  document.getElementById("prevBtn").style.visibility = wizStep === 1 ? "hidden" : "visible";
  document.getElementById("nextBtn").textContent = wizStep === WIZ_STEPS ? "Agendar fecha ✓" : "Siguiente →";
}

function wizardStep(s) {
  if (s === 1) return `
    <h3 class="font-bold text-slate-900 text-lg mb-1"> ¿Cuándo es la fecha?</h3>
    <p class="text-sm text-slate-500 mb-5">Empezamos por lo más importante.</p>
    <label class="block text-sm font-medium text-slate-700 mb-1">Fecha</label>
    <input id="w_fecha" type="date" value="${wizData.fecha||''}" class="w-full px-4 py-3 rounded-lg border border-slate-300 text-base">
  `;
  if (s === 2) return `
    <h3 class="font-bold text-slate-900 text-lg mb-1"> ¿Qué artista toca?</h3>
    <p class="text-sm text-slate-500 mb-5">Seleccioná del roster o agregá uno nuevo.</p>
    <label class="block text-sm font-medium text-slate-700 mb-1">Artista</label>
    <select id="w_artista" class="w-full px-4 py-3 rounded-lg border border-slate-300 text-base">
      <option value="">— Seleccionar —</option>
      ${SEED.artistas.map(a => `<option ${wizData.artista===a.nombre?'selected':''}>${a.nombre}</option>`).join("")}
    </select>
  `;
  if (s === 3) return `
    <h3 class="font-bold text-slate-900 text-lg mb-1"> ¿Dónde y con quién?</h3>
    <p class="text-sm text-slate-500 mb-5">Datos del venue y la productora.</p>
    <div class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Ciudad</label>
        <input id="w_ciudad" type="text" value="${wizData.ciudad||''}" class="w-full px-4 py-3 rounded-lg border border-slate-300" placeholder="Ej: Buenos Aires">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Productora</label>
        <input id="w_productora" type="text" value="${wizData.productora||''}" list="venuesList" class="w-full px-4 py-3 rounded-lg border border-slate-300" placeholder="Ej: Crobar">
        <datalist id="venuesList">${SEED.venues.map(v=>`<option value="${v.nombre}">`).join("")}</datalist>
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Promotor / Liaison</label>
        <input id="w_promotor" type="text" value="${wizData.promotor||''}" class="w-full px-4 py-3 rounded-lg border border-slate-300" placeholder="Nombre del contacto">
      </div>
    </div>
  `;
  if (s === 4) return `
    <h3 class="font-bold text-slate-900 text-lg mb-1"> Oferta económica</h3>
    <p class="text-sm text-slate-500 mb-5">Cuánto pagan y si hay seña.</p>
    <div class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Oferta</label>
        <input id="w_oferta" type="text" value="${wizData.oferta||''}" class="w-full px-4 py-3 rounded-lg border border-slate-300" placeholder="Ej: 1500 USD + 15% BF">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-2">Seña</label>
        <div class="grid grid-cols-2 gap-2">
          <button type="button" onclick="wizData.sena='Si';renderWizard()" class="py-3 rounded-lg border-2 ${wizData.sena==='Si'?'border-indigo-600 bg-indigo-50':'border-slate-300'} font-semibold">Sí</button>
          <button type="button" onclick="wizData.sena='No';renderWizard()" class="py-3 rounded-lg border-2 ${wizData.sena==='No'?'border-indigo-600 bg-indigo-50':'border-slate-300'} font-semibold">No</button>
        </div>
      </div>
    </div>
  `;
  if (s === 5) return `
    <h3 class="font-bold text-slate-900 text-lg mb-1"> Estado y responsable</h3>
    <p class="text-sm text-slate-500 mb-5">¿Quién está a cargo y en qué etapa está la fecha?</p>
    <div class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-2">Estado</label>
        <div class="grid grid-cols-3 gap-2">
          ${["Por confirmar","Confirmado","Finalizado"].map(s=>`
            <button type="button" onclick="wizData.estado='${s}';renderWizard()"
              class="py-2 rounded-lg border-2 text-sm ${wizData.estado===s?'border-indigo-600 bg-indigo-50 font-semibold':'border-slate-300'}">${s}</button>
          `).join("")}
        </div>
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-2">Responsable</label>
        <div class="grid grid-cols-3 gap-2">
          ${["Rama","Juanfra","EL DJ"].map(r=>`
            <button type="button" onclick="wizData.responsable='${r}';renderWizard()"
              class="py-2 rounded-lg border-2 text-sm ${wizData.responsable===r?'border-indigo-600 bg-indigo-50 font-semibold':'border-slate-300'}">${r}</button>
          `).join("")}
        </div>
      </div>
    </div>
  `;
  if (s === 6) return `
    <h3 class="font-bold text-slate-900 text-lg mb-1"> Logística y comentarios</h3>
    <p class="text-sm text-slate-500 mb-5">Detalles finales (opcional).</p>
    <div class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Logística</label>
        <input id="w_logistica" type="text" value="${wizData.logistica||''}" class="w-full px-4 py-3 rounded-lg border border-slate-300" placeholder="Vuelos, hotel, traslados...">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Comentarios</label>
        <textarea id="w_comentarios" rows="3" class="w-full px-4 py-3 rounded-lg border border-slate-300" placeholder="Notas adicionales">${wizData.comentarios||''}</textarea>
      </div>
      <div class="bg-indigo-50 border border-indigo-200 rounded-lg p-3 text-sm text-indigo-900">
        <strong>Resumen:</strong> ${wizData.artista||'—'} en ${wizData.ciudad||'—'} (${wizData.productora||'—'}) el ${wizData.fecha?fmtDate(wizData.fecha):'—'}.
      </div>
    </div>
  `;
}

function captureStep() {
  if (wizStep === 1) wizData.fecha = document.getElementById("w_fecha").value;
  if (wizStep === 2) wizData.artista = document.getElementById("w_artista").value;
  if (wizStep === 3) {
    wizData.ciudad = document.getElementById("w_ciudad").value;
    wizData.productora = document.getElementById("w_productora").value;
    wizData.promotor = document.getElementById("w_promotor").value;
  }
  if (wizStep === 4) wizData.oferta = document.getElementById("w_oferta").value;
  if (wizStep === 6) {
    wizData.logistica = document.getElementById("w_logistica").value;
    wizData.comentarios = document.getElementById("w_comentarios").value;
  }
}
function validateStep() {
  captureStep();
  if (wizStep === 1 && !wizData.fecha) return "Necesitás indicar la fecha.";
  if (wizStep === 2 && !wizData.artista) return "Seleccioná un artista.";
  if (wizStep === 3 && !wizData.ciudad) return "Indicá al menos la ciudad.";
  if (wizStep === 5 && !wizData.estado) return "Elegí un estado.";
  return null;
}
function nextStep() {
  const err = validateStep();
  if (err) { toast(err); return; }
  if (wizStep === WIZ_STEPS) {
    finishWizard();
    return;
  }
  wizStep++;
  renderWizard();
}
function prevStep() {
  captureStep();
  if (wizStep > 1) wizStep--;
  renderWizard();
}
function finishWizard() {
  state.calendario.push({...wizData});
  saveState();
  closeWizard();
  toast("✓ Fecha agendada");
  navigate("calendario");
  setTimeout(()=>openEvent(wizData.id), 300);
}

/* ============================================================
   EVENT DETAIL MODAL
============================================================ */
function openEvent(id) {
  const e = state.calendario.find(x => x.id === id);
  if (!e) return;
  const modal = document.getElementById("eventModal");
  modal.classList.remove("hidden");
  document.getElementById("eventModalContent").innerHTML = renderEventDetail(e);
}
function closeEvent() {
  document.getElementById("eventModal").classList.add("hidden");
}

function renderEventDetail(e) {
  const d = daysUntil(e.fecha);
  const isPast = d < 0;
  const pre = preProgress(e);
  const post = postProgress(e);
  const phase = isPast ? "post" : "pre";

  const dLabel = d === 0 ? "Hoy" : d === 1 ? "Mañana" : d > 0 ? `En ${d} días` : `Hace ${-d} días`;

  return `
    <div class="gradient-bg text-white px-6 py-5 rounded-t-2xl flex justify-between items-start">
      <div class="flex-grow min-w-0">
        <div class="flex items-center gap-2 mb-1">
          ${estadoBadge(e.estado)}
          <span class="text-xs text-indigo-200">${dLabel} · ${fmtDate(e.fecha)}</span>
        </div>
        <h2 class="font-bold text-2xl truncate">${e.artista}</h2>
        <p class="text-indigo-100 text-sm">${e.ciudad}${e.productora?` · ${e.productora}`:""}</p>
      </div>
      <button onclick="closeEvent()" class="text-white/70 hover:text-white text-2xl leading-none">&times;</button>
    </div>

    <div class="p-6 space-y-6">
      <!-- Datos básicos -->
      <div class="grid grid-cols-2 gap-4 text-sm">
        ${detail("Promotor / Laison", e.promotor)}
        ${detail("Responsable", e.responsable)}
        ${detail("Oferta", e.oferta)}
        ${detail("Seña confirmada", e.sena)}
        ${detail("Logística", e.logistica)}
        ${detail("Gastos de viaje", e.gastosViaje)}
      </div>
      ${e.comentarios ? `<div class="bg-amber-50 border border-amber-200 rounded-lg p-3 text-sm text-amber-900"><strong>Comentarios:</strong> ${e.comentarios}</div>` : ''}

      <!-- Tabs de checklist -->
      <div class="flex gap-2 border-b border-slate-200">
        <button onclick="switchPhase('${e.id}','pre')" id="tabPre"
          class="px-4 py-2 text-sm font-semibold border-b-2 ${phase==='pre'?'border-indigo-600 text-indigo-600':'border-transparent text-slate-500'}">
          Pre-evento (${pre.done}/${pre.total})
        </button>
        <button onclick="switchPhase('${e.id}','post')" id="tabPost"
          class="px-4 py-2 text-sm font-semibold border-b-2 ${phase==='post'?'border-indigo-600 text-indigo-600':'border-transparent text-slate-500'}">
          Post-evento (${post.done}/${post.total})
        </button>
      </div>

      <div id="checklistArea">
        ${phase === 'pre' ? renderPreChecklist(e) : renderPostChecklist(e)}
      </div>

      <div class="flex justify-between pt-4 border-t border-slate-200">
        <button onclick="if(confirm('¿Eliminar esta fecha?'))deleteEvent('${e.id}')" class="text-sm text-rose-600 hover:underline">Eliminar fecha</button>
        <button onclick="closeEvent()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-lg text-sm font-semibold">Cerrar</button>
      </div>
    </div>
  `;
}

function detail(label, val) {
  return `<div>
    <p class="text-xs text-slate-500 uppercase font-semibold">${label}</p>
    <p class="text-slate-900 mt-0.5">${val || "—"}</p>
  </div>`;
}

function switchPhase(id, phase) {
  const e = state.calendario.find(x=>x.id===id);
  document.getElementById("checklistArea").innerHTML = phase==="pre" ? renderPreChecklist(e) : renderPostChecklist(e);
  document.getElementById("tabPre").className = `px-4 py-2 text-sm font-semibold border-b-2 ${phase==='pre'?'border-indigo-600 text-indigo-600':'border-transparent text-slate-500'}`;
  document.getElementById("tabPost").className = `px-4 py-2 text-sm font-semibold border-b-2 ${phase==='post'?'border-indigo-600 text-indigo-600':'border-transparent text-slate-500'}`;
}

function renderPreChecklist(e) {
  const d = daysUntil(e.fecha);
  const limitDays = 7;
  const remaining = d - limitDays;
  let banner = "";
  if (d >= 0 && d <= limitDays) {
    banner = `<div class="bg-rose-50 border border-rose-200 rounded-lg p-3 text-sm text-rose-900 mb-4">
       <strong>Última semana:</strong> el límite para tener todo confirmado es a 7 días del evento. Quedan ${d} día${d!==1?'s':''}.
    </div>`;
  } else if (d > limitDays) {
    banner = `<div class="bg-indigo-50 border border-indigo-200 rounded-lg p-3 text-sm text-indigo-900 mb-4">
       Tenés ${remaining} día${remaining!==1?'s':''} hasta el límite (1 semana antes del evento).
    </div>`;
  }
  return banner + PRE_CHECKLIST.map(item => checklistItem(e, item, "Pre")).join("");
}

function renderPostChecklist(e) {
  // Calcular saldo pendiente automáticamente
  const oferta = parseFloat(String(e.oferta||"").replace(/[^\d.]/g,"")) || 0;
  const sena = e.sena === "Si" ? oferta * 0.3 : 0; // estimación 30% si hubo seña
  const gastos = parseFloat(e.gastos || 0) || 0;
  const saldoEstim = Math.max(0, oferta - sena + gastos);

  return `
    <div class="bg-emerald-50 border border-emerald-200 rounded-lg p-4 mb-4">
      <p class="text-xs text-emerald-700 uppercase font-semibold">Cálculo de saldo</p>
      <div class="grid grid-cols-3 gap-2 mt-2 text-center">
        <div><p class="text-xs text-slate-500">Oferta</p><p class="font-bold text-slate-900">${oferta?oferta.toLocaleString("es-AR"):"—"}</p></div>
        <div><p class="text-xs text-slate-500">Seña est.</p><p class="font-bold text-slate-900">${sena?sena.toLocaleString("es-AR"):"—"}</p></div>
        <div><p class="text-xs text-slate-500">Saldo + gastos</p><p class="font-bold text-emerald-700 text-lg">${saldoEstim?saldoEstim.toLocaleString("es-AR"):"—"}</p></div>
      </div>
      <p class="text-[11px] text-emerald-700 mt-2">El saldo final se ajusta cuando cargás los gastos del artista abajo.</p>
    </div>
  ` + POST_CHECKLIST.map(item => checklistItem(e, item, "Post")).join("");
}

function checklistItem(e, item, phase) {
  const list = phase === "Pre" ? "checklistPre" : "checklistPost";
  const v = (e[list] || {})[item.key];
  const done = item.type === "check" ? v === true : (v && String(v).trim().length > 0);
  if (item.type === "check") {
    return `
      <div class="checklist-item ${done?'done':''} flex items-center gap-3 px-4 py-3 rounded-lg border border-slate-200 mb-2">
        <input type="checkbox" ${done?'checked':''} onchange="toggleCheck('${e.id}','${list}','${item.key}',this.checked)"
          class="w-5 h-5 rounded text-indigo-600 cursor-pointer">
        <span class="text-2xl">${item.icon}</span>
        <span class="check-label flex-grow font-medium text-slate-800">${item.label}${item.optional?' <span class="text-xs text-slate-400 font-normal">(opcional)</span>':''}</span>
      </div>
    `;
  }
  return `
    <div class="checklist-item ${done?'done':''} px-4 py-3 rounded-lg border border-slate-200 mb-2">
      <div class="flex items-center gap-3 mb-2">
        <span class="text-2xl">${item.icon}</span>
        <span class="check-label flex-grow font-medium text-slate-800">${item.label}${item.optional?' <span class="text-xs text-slate-400 font-normal">(opcional)</span>':''}</span>
        ${done?'<span class="text-emerald-600 text-sm">✓</span>':''}
      </div>
      <textarea oninput="updateInfo('${e.id}','${list}','${item.key}',this.value)"
        rows="2" placeholder="${item.placeholder||''}"
        class="w-full px-3 py-2 rounded border border-slate-200 text-sm">${v||''}</textarea>
    </div>
  `;
}

function toggleCheck(id, list, key, val) {
  const e = state.calendario.find(x=>x.id===id);
  e[list] = e[list] || {};
  e[list][key] = val;
  saveState();
  // re-render dentro del modal sin cerrarlo
  document.getElementById("eventModalContent").innerHTML = renderEventDetail(e);
  // mantener fase actual
  const phase = list === "checklistPost" ? "post" : "pre";
  switchPhase(id, phase);
}

function updateInfo(id, list, key, val) {
  const e = state.calendario.find(x=>x.id===id);
  e[list] = e[list] || {};
  e[list][key] = val;
  saveState();
}

function deleteEvent(id) {
  state.calendario = state.calendario.filter(x => x.id !== id);
  saveState();
  closeEvent();
  toast("Fecha eliminada");
  render();
}

/* ============================================================
   TOAST
============================================================ */
let toastTimer;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.remove("hidden");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.add("hidden"), 2500);
}

/* ============================================================
   INIT
============================================================ */
navigate("dashboard");
</script>
</body>
</html>
